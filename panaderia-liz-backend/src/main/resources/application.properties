# Puerto donde correrá el servidor Backend
server.port=8080

# Configuración de conexión a la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_panaderia_liz?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Configuración de Hibernate / JPA
# "update" actualizará las tablas automáticamente según el código Java
spring.jpa.hibernate.ddl-auto=update
# Para ver las consultas SQL en la consola (muy útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true